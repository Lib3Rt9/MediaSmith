[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mediasmith"
dynamic = ["version"]
description = "Shrink and convert folders of images for archiving, keeping quality as close to the original as possible."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["image", "converter", "resize", "jpeg", "webp", "avif", "archive", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Environment :: Console",
]
dependencies = [
    "Pillow>=9.1",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
heic = ["pillow-heif"]
avif = ["pillow-avif-plugin"]
progress = ["tqdm"]
all = ["pillow-heif", "pillow-avif-plugin", "tqdm"]
dev = ["pytest"]

[project.scripts]
mediasmith = "mediasmith.cli:main"

[tool.setuptools.dynamic]
version = {attr = "mediasmith.__version__"}

[tool.setuptools.packages.find]
include = ["mediasmith*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
